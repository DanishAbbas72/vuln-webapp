# ---- Required ----
sonar.projectKey=vuln-webapp
sonar.projectName=Vulnerable Web App (SAST Test)
sonar.projectVersion=1.0

# ---- SonarQube Cloud only: uncomment and set your organization key ----
# sonar.organization=your-org-key

# ---- Sources ----
sonar.sources=.
sonar.exclusions=**/vendor/**,**/node_modules/**,uploads/**,.github/**
sonar.sourceEncoding=UTF-8

# Treat .php, .js and .html files with their respective analyzers
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js
sonar.html.file.suffixes=.html,.htm
