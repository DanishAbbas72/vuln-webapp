# Bound to 127.0.0.1 only - do NOT expose this app to a network.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: SuperSecret123!
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
